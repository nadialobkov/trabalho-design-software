# Serves the built React app and forwards /api/* to the backend container.
# Same origin for screens and API, so the backend needs no CORS setup.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://app:7555/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
