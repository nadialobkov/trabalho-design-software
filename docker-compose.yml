# Starts everything with one command: docker compose up --build
#   app      → the backend (monolith)      http://localhost:7555/docs
#   db       → PostgreSQL                  localhost:5433 (5432 inside Docker)
#   mailpit  → fake e-mail inbox           http://localhost:8025
# Ports are bound to 127.0.0.1, so only this computer can reach them.
# The passwords below are for local development only.

services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: manutencao
      POSTGRES_PASSWORD: manutencao
      POSTGRES_DB: manutencao
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql
      # Run in name order only the first time the database is created.
      - ./banco/criar_banco_teste.sql:/docker-entrypoint-initdb.d/00-criar_banco_teste.sql:ro
      - ./banco/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./banco/dados_exemplo.sql:/docker-entrypoint-initdb.d/02-dados_exemplo.sql:ro
    healthcheck:
      # TCP check: during the first setup the server only listens on a socket,
      # so this passes only after the tables and sample data are loaded.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U manutencao -d manutencao"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"   # web inbox
      - "127.0.0.1:1025:1025"   # SMTP

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://manutencao:manutencao@db:5432/manutencao
      SMTP_HOST: mailpit
      SMTP_PORTA: "1025"
      SMTP_REMETENTE: manutencao@example.com
    ports:
      - "127.0.0.1:${APP_PORTA:-7555}:7555"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  dados-postgres:
