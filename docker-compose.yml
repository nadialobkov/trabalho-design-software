# Inicia todos os serviços com docker compose up --build
#   app      → backend monolítico        http://localhost:7555/docs
#   db       → PostgreSQL                localhost:5433 (5432 dentro do Docker)
#   mailpit  → caixa de e-mail de teste  http://localhost:8025
# As portas escutam em 127.0.0.1 e só aceitam conexões deste computador.
# As senhas abaixo servem apenas para desenvolvimento local.

services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_USER: manutencao
      POSTGRES_PASSWORD: manutencao
      POSTGRES_DB: manutencao
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql
      # Executa os scripts em ordem de nome na primeira inicialização do banco.
      - ./banco/criar_banco_teste.sql:/docker-entrypoint-initdb.d/00-criar_banco_teste.sql:ro
      - ./banco/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./banco/dados_exemplo.sql:/docker-entrypoint-initdb.d/02-dados_exemplo.sql:ro
    healthcheck:
      # Na configuração inicial, o PostgreSQL atende apenas pelo socket local.
      # O teste via TCP só passa depois que as tabelas e os dados de exemplo são carregados.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U manutencao -d manutencao"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"   # Caixa de entrada no navegador
      - "127.0.0.1:1025:1025"   # SMTP

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://manutencao:manutencao@db:5432/manutencao
      SMTP_HOST: mailpit
      SMTP_PORTA: "1025"
      SMTP_REMETENTE: manutencao@example.com
      # Usa o horário de Brasília, o mesmo do laboratório. Em UTC, os horários
      # dos chamados ficariam 3 horas à frente dos registrados pelo uv run local.
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${APP_PORTA:-7555}:7555"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  dados-postgres:
