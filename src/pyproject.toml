[project]
name = "manutencao"
version = "0.1.0"
description = "Backend core for lab equipment maintenance"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
